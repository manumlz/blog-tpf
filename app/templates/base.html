<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blog personal - Victor Manuel Miranda López - UTN FRT">
    <title>{% block title %}Blog Personal{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="site-header">
        <div class="container">
            <div class="header-inner">
                <span class="site-logo">Blog Personal</span>
                <nav class="site-nav">
                    <a href="{{ url_for('index') }}">Inicio</a>
                    <a href="/static/informe.pdf" target="_blank" rel="noopener">Informe PDF</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="site-main">
        <div class="container">

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert--{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            {% block content %}{% endblock %}

        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Victor Manuel Miranda López &mdash; UTN FRT &mdash; 2026</p>
        </div>
    </footer>

</body>
</html>
